# Coding v1.0：设计文档 §11.1 的版本——测试失败就调用 Debug，Debug 交回 done 就直接 Done。
# W8 证明不了：Debug 只承诺"修好报告里的那一个失败测试且不回归"，
# 推不出"全部验收测试通过"。这是"调用方依赖了一个不够强的承诺"（§9.2）。
skill: Coding
version: "1.0"
interface:
  inputs:  {spec: spec, repo: repo}
  outputs: {patch: patch}
  pre: "has_acceptance_tests(spec)"
  post_safe: "outcome == done -> passes_acceptance(patch, spec, repo) && passes_suite(patch, repo)"
  inv: ["!touches_tests(patch)"]
  budget: {llm_calls: 10}
state:
  plan: text
  all_pass: bool
  failing_report: issue
nodes:
  understand:
    kind: agent
    reads: [spec, repo]
    writes: [plan]
    prompt: "阅读需求，写出实现计划。"
    contract: {post: "len(plan) > 0"}
  implement:
    kind: agent
    reads: [spec, repo, plan]
    writes: [patch]
    prompt: "按计划实现需求，不要碰测试。"
    contract: {pre: "len(plan) > 0", post: "!touches_tests(patch)"}
  test:
    kind: tool
    reads: [repo, patch, spec]
    writes: [all_pass, failing_report]
    fn: coding.run_tests
    ensures: >-
      all_pass == (passes_acceptance(patch, spec, repo) && passes_suite(patch, repo))
      && (!all_pass -> has_repro_test(failing_report))
  debug:
    kind: call
    skill: "Debug >= 1.0"
    bind_in:  {issue: failing_report, repo: repo}
    bind_out: {patch: patch}
  done:    {kind: terminal, outcome: done}
  give_up: {kind: terminal, outcome: give_up}
entry: understand
edges:
  - {src: understand, dst: implement, guard: "true"}
  - {src: implement,  dst: test,      guard: "true"}
  - {src: test,  dst: done,    guard: "all_pass"}
  - {src: test,  dst: debug,   guard: "!all_pass"}
  - {src: debug, dst: done,    guard: "debug.outcome == done"}       # ← 漏洞：没有重新验收
  - {src: debug, dst: give_up, guard: "debug.outcome != done"}
