# Coding v1.0: the version from Step 1 design doc §9.1. On test failure it calls Debug, and goes straight to Done when Debug returns done.
# W8 cannot be proved: Debug only promises "fix the one failing test in the report without regressions",
# which does not imply "all acceptance tests pass". This is "the caller relies on a promise that is too weak" (Step 2 design doc §5.2.2).
skill: Coding
version: "1.0"
interface:
  inputs:  {spec: spec, repo: repo}
  outputs: {patch: patch}
  pre: "has_acceptance_tests(spec)"
  post_safe: "outcome == done -> passes_acceptance(patch, spec, repo) && passes_suite(patch, repo)"
  inv: ["!touches_tests(patch)"]
  budget: {llm_calls: 10}
state:
  plan: text
  all_pass: bool
  failing_report: issue
nodes:
  understand:
    kind: agent
    reads: [spec, repo]
    writes: [plan]
    prompt: "Read the spec and write an implementation plan."
    contract: {post: "len(plan) > 0"}
  implement:
    kind: agent
    reads: [spec, repo, plan]
    writes: [patch]
    prompt: "Implement the spec following the plan. Do not touch the tests."
    contract: {pre: "len(plan) > 0", post: "!touches_tests(patch)"}
  test:
    kind: tool
    reads: [repo, patch, spec]
    writes: [all_pass, failing_report]
    fn: coding.run_tests
    ensures: >-
      all_pass == (passes_acceptance(patch, spec, repo) && passes_suite(patch, repo))
      && (!all_pass -> has_repro_test(failing_report))
  debug:
    kind: call
    skill: "Debug >= 1.0"
    bind_in:  {issue: failing_report, repo: repo}
    bind_out: {patch: patch}
  done:    {kind: terminal, outcome: done}
  give_up: {kind: terminal, outcome: give_up}
entry: understand
edges:
  - {src: understand, dst: implement, guard: "true"}
  - {src: implement,  dst: test,      guard: "true"}
  - {src: test,  dst: done,    guard: "all_pass"}
  - {src: test,  dst: debug,   guard: "!all_pass"}
  - {src: debug, dst: done,    guard: "debug.outcome == done"}       # ← flaw: no re-acceptance
  - {src: debug, dst: give_up, guard: "debug.outcome != done"}
