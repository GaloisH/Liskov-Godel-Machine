# Debug v1.0: the version from Step 1 design doc §9.1, with a deliberate flaw: the guard to Done checks rep but not suite.
# W1–W7 all pass, but W8 cannot be proved (spec consistency unproved): a warning visible at admission time.
skill: Debug
version: "1.0"
interface:
  inputs:  {issue: issue, repo: repo}
  outputs: {patch: patch}
  pre: "has_repro_test(issue)"
  post_safe: "outcome == done -> passes_repro(patch, issue, repo) && passes_suite(patch, repo)"
  post_live: "outcome == done"
  inv: ["!touches_tests(patch)"]
  budget: {llm_calls: 8}
state:
  F: "list[path]"        # opaque
  rep: bool              # decidable
  suite: bool            # decidable
  k: "int[0..2]"         # loop counter: number of retries so far
nodes:
  locate:
    kind: agent
    reads: [issue, repo]
    writes: [F]
    prompt: "Find the files that need to change for the issue."
    contract: {pre: "true", post: "len(F) > 0 && relevant(F, issue)"}
    prior: Beta(1,1)
  write_patch:
    kind: agent
    reads: [issue, repo, F]
    writes: [patch]
    prompt: "Fix the issue by editing only files in F. Do not touch the tests."
    contract: {pre: "len(F) > 0", post: "files(patch) ⊆ F && !touches_tests(patch)"}
    fault_model: {ok: "a*b", regress: "a*(1-b)", nofix: "1-a"}
  test:
    kind: tool
    reads: [repo, patch, issue]
    writes: [rep, suite]
    fn: debug.run_tests
    ensures: "rep == passes_repro(patch, issue, repo) && suite == passes_suite(patch, repo)"
  done:    {kind: terminal, outcome: done}
  give_up: {kind: terminal, outcome: give_up}
entry: locate
edges:
  - {src: locate,      dst: write_patch, guard: "true"}
  - {src: write_patch, dst: test,        guard: "true"}
  - {src: test, dst: done,        guard: "rep"}                       # ← flaw: suite is not checked
  - {src: test, dst: write_patch, guard: "!rep && k < 2", counter: k}
  - {src: test, dst: give_up,     guard: "!rep && k >= 2"}
