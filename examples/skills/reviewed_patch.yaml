# ReviewedPatch: an implementation workflow with code review. Shows how to write a "semantic branch" (design doc §4):
# "is the code clean" cannot go on an edge; instead the review agent node outputs the enum verdict, and edges only test verdict.
skill: ReviewedPatch
version: "1.0"
interface:
  inputs:  {spec: spec, repo: repo}
  outputs: {patch: patch}
  pre: "true"
  post_safe: "outcome == done -> passes_suite(patch, repo) && clean(patch)"
  inv: ["!touches_tests(patch)"]
  budget: {llm_calls: 6}
state:
  feedback: text
  verdict: "{approve, revise}"
  ok: bool
  round: "int[0..2]"
nodes:
  init:                         # implement reads feedback in the first round, so it must be written first (W4: write before read)
    kind: tool
    reads: []
    writes: [feedback]
    fn: review.no_feedback
  implement:
    kind: agent
    reads: [spec, repo, feedback]
    writes: [patch]
    prompt: "Implement the spec; if there is review feedback, address it. Do not touch the tests."
    contract: {post: "!touches_tests(patch)"}
  review:
    kind: agent
    reads: [spec, patch]
    writes: [verdict, feedback]
    prompt: "Review the patch. approve if it is clean, otherwise revise and give feedback."
    contract: {post: "verdict == approve -> clean(patch)"}
  test:
    kind: tool
    reads: [repo, patch]
    writes: [ok]
    fn: review.run_suite
    ensures: "ok == passes_suite(patch, repo)"
  done:    {kind: terminal, outcome: done}
  give_up: {kind: terminal, outcome: give_up}
entry: init
edges:
  - {src: init,      dst: implement, guard: "true"}
  - {src: implement, dst: review,    guard: "true"}
  - {src: review, dst: test,      guard: "verdict == approve", label: approved}
  - {src: review, dst: implement, guard: "verdict == revise && round < 2", counter: round, label: revise}
  - {src: review, dst: give_up,   guard: "verdict == revise && round >= 2"}
  - {src: test,   dst: done,      guard: "ok"}
  - {src: test,   dst: give_up,   guard: "!ok"}
