# WriteDocstring: a single-node skill, the degenerate case of a graph (design doc §13). Evolution may later grow it into a multi-node graph.
skill: WriteDocstring
version: "1.0"
interface:
  inputs:  {code: text}
  outputs: {doc: text}
  pre: "len(code) > 0"
  post_safe: "outcome == done -> describes(doc, code)"
  budget: {llm_calls: 1}
nodes:
  write:
    kind: agent
    reads: [code]
    writes: [doc]
    prompt: "Write a one-sentence docstring for this code."
    contract: {pre: "len(code) > 0", post: "len(doc) > 0 && describes(doc, code)"}
  done: {kind: terminal, outcome: done}
entry: write
edges:
  - {src: write, dst: done, guard: "true"}
